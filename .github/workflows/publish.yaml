name: Publish Rust Crate

on:
  workflow_call:
    inputs:
      manifest_path:
        description: "Path to Cargo.toml for the crate to publish"
        required: false
        type: string
        default: "Cargo.toml"

      cargo_publish_args:
        description: "Optional additional arguments for cargo publish"
        required: false
        type: string
        default: "--locked"

      dry_run:
        description: "Run cargo publish in dry-run mode"
        required: false
        type: boolean
        default: false

      runs-on:
        description: "The OS to run the job on"
        required: false
        type: string
        default: "ubuntu-latest"

    secrets:
      crates_io_token:
        description: "crates.io API token"
        required: true

jobs:
  publish:
    runs-on: ${{ inputs.runs-on }}

    permissions:
      contents: read

    steps:
      - uses: runs-on/action@v2.0.3

      - name: Checkout Code
        uses: actions/checkout@v5.0.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4.2.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.crates_io_token }}
        run: |
          set -euo pipefail

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish --dry-run --manifest-path "${{ inputs.manifest_path }}" ${{ inputs.cargo_publish_args }}
          else
            cargo publish --manifest-path "${{ inputs.manifest_path }}" ${{ inputs.cargo_publish_args }}
          fi
